name: Release

# Push a tag like v1.2.0 to publish a release. Installed copies pick it up through Sparkle.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Build app
        run: ./scripts/build-app.sh

      - name: Zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/Icon Picker.app" "build/IconPicker-$VERSION.zip"
          # Same archive under a fixed name, for a stable "latest" download link in the README.
          cp "build/IconPicker-$VERSION.zip" build/IconPicker.zip

      - name: Sign update and write appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "::error::SPARKLE_PRIVATE_KEY secret is missing"; exit 1; }
          ./scripts/make-appcast.sh "build/IconPicker-$VERSION.zip" "$VERSION" "$BUILD" "$GITHUB_REF_NAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/IconPicker-$VERSION.zip" build/IconPicker.zip build/appcast.xml \
            --title "Icon Picker $VERSION" --generate-notes
